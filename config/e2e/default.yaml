app:
  name: 'blog-auto-poster-e2e'
  env: 'e2e'
  logLevel: 'warn'
  dataDir: './data'
  outputDir: './output'
  cacheDir: './.cache'
affiliates:
  coupang: { enabled: false }
platforms:
  tistory: { enabled: false }
  wordpress: { enabled: false }
  youtube-shorts: { enabled: false }
  naver: { enabled: false }
imageProviders:
  dalle: { enabled: false }
  stable-diffusion: { enabled: false }
  gemini: { enabled: false }
keywordProviders:
  naver: { enabled: false }
  google-trends: { enabled: false }
  coupang: { enabled: false }
  naver-api-hub:
    enabled: true
    apiKey: 'e2e-key-id'
    apiSecret: 'e2e-key-secret'
    baseUrl: 'http://127.0.0.1:4600'
    searchTrend: true
    shoppingInsight: true
    searchTrendBaseUrl: 'http://127.0.0.1:4600/search-trend/v1'
    shoppingBaseUrl: 'http://127.0.0.1:4600/shopping/v1'
keywords:
  trendAnchor: '쇼핑'
  # 데이터랩 인기검색어 랭킹 — e2e에서는 mock 서버로 교체(이슈 #14)
  datalabApi:
    baseUrl: 'http://127.0.0.1:4600'
  shoppingSignals: ['추천', '가격', '최저가', '리뷰']
  shoppingCategoryPool:
    - { name: 'mock-category-a', category: '10000001' }
    - { name: 'mock-category-b', category: '10000002' }
scheduler:
  enabled: false
  timezone: 'Asia/Seoul'
  jobs: []
templates:
  dir: './templates'
  defaultTemplate: 'coupang-product-review'
  validation: true
web:
  enabled: true
  jwtSecret: 'e2e-jwt-secret-verification-only'
  jwtExpiresIn: '1h'
  auth:
    disabled: false
  cors:
    origin:
      - 'http://127.0.0.1:4173'
