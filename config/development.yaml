app:
  name: blog-auto-poster
  version: 1.0.0
  env: development
  logLevel: info
  dataDir: ./data
  cacheDir: ./.cache
  outputDir: ./output
affiliates:
  coupang:
    enabled: true
    apiKey: ''
    apiSecret: ''
    accessToken: ''
    refreshToken: ''
    tokenExpiresAt: 0
    trackingId: ''
    rateLimit:
      requestsPerMinute: 100
  aliexpress: {}
  naver-shopping: {}
platforms:
  tistory:
    enabled: false
    blogName: ''
    username: ''
    password: ''
    apiKey: ''
    accessToken: ''
    rateLimit:
      requestsPerMinute: 30
  wordpress:
    enabled: false
    url: ''
    username: ''
    appPassword: ''
    rateLimit:
      requestsPerMinute: 60
  youtube-shorts:
    enabled: false
    clientId: ''
    clientSecret: ''
    refreshToken: ''
    accessToken: ''
    channelId: ''
    rateLimit:
      requestsPerMinute: 50
  naver:
    enabled: false
    blogId: my-naver-blog
    username: u
    password: p
    clientId: cid
    clientSecret: csec
    rateLimit:
      requestsPerMinute: 30
  youtube: {}
imageProviders:
  dalle:
    enabled: false
    apiKey: ''
    model: dall-e-3
    defaultStyle: vivid
    defaultQuality: hd
    defaultSize: 1024x1024
  stable-diffusion:
    enabled: false
    apiUrl: https://api.stability.ai
    apiKey: ''
    defaultEngine: stable-diffusion-xl-1024-v1-0
  gemini:
    enabled: false
    apiKey: ''
    model: gemini-1.5-pro
  openai: {}
keywordProviders:
  naver:
    enabled: false
    clientId: ''
    clientSecret: ''
  google-trends:
    enabled: true
    useSerpApi: false
    serpApiKey: ''
  coupang:
    enabled: true
  naver-api-hub:
    enabled: true
    apiKey: m8gv2ia7pq
    apiSecret: 1AeVlPZgoN1fJU9iEipfmxB2dBmBcJ3SQz4t7ffg
    baseUrl: https://naverapihub.apigw.ntruss.com/search/v1
    useApiHub: true
  naver-api_hub: {}
templates:
  dir: ./templates
  defaultTemplate: coupang-product-review
  validation: true
scheduler:
  enabled: false
  timezone: Asia/Seoul
  jobs:
    - name: daily-keyword-research
      type: RESEARCH
      cron: 0 6 * * *
      enabled: true
      config:
        seedKeywords:
          - 무선청소기
          - 로봇청소기
          - 공기청정기
          - 가습기
        limit: 20
    - name: daily-content-generation
      type: GENERATE
      cron: 0 7 * * *
      enabled: true
      config:
        maxPostsPerRun: 5
        template: coupang-product-review
        platforms:
          - tistory
    - name: daily-publishing
      type: PUBLISH
      cron: 0 8 * * *
      enabled: true
      config:
        platforms:
          - tistory
        maxPostsPerRun: 5
    - name: hourly-analytics-sync
      type: SYNC_ANALYTICS
      cron: 0 * * * *
      enabled: true
      config:
        platforms:
          - tistory
        affiliates:
          - coupang
  concurrency:
    default: 3
    perPlatform: {}
    perAffiliate: {}
intelligence:
  keywordResearch:
    defaultProvider: naver
    cacheTtlHours: 24
    minVolume: 100
  competitorAnalysis:
    defaultProviders:
      - naver-blog
      - tistory
    cacheTtlHours: 1
    minViews: 100
  topicSelection:
    maxTopics: 10
    minScore: 0.3
    weightSearchVolume: 0.3
    weightCommissionRate: 0.25
    weightContentGap: 0.25
    weightTrendVelocity: 0.2
publishing:
  dryRun: true
  maxConcurrentPublishes: 2
jobQueue:
  dbPath: ./data/jobs.sqlite
  maxConcurrentJobs: 3
  defaultRetryAttempts: 3
  defaultRetryDelayMs: 5000
  deadLetterAfterAttempts: 5
seo:
  defaultTitleTemplate: '{{productName}} 리뷰 - 장단점 총정리'
  defaultDescriptionTemplate: '{{productName}} 구매 전 꼭 확인하세요. 가격 {{price}}원, 장점/단점 분석.'
  defaultKeywords:
    - 리뷰
    - 추천
    - 가성비
    - 후기
  jsonLd: true
web:
  enabled: false
  host: 0.0.0.0
  port: 3000
  jwtSecret: ''
  jwtExpiresIn: 7d
  auth:
    disabled: false
  cors:
    origin: '*'
    credentials: true
  rateLimit:
    windowMs: 900000
    maxRequests: 100
keywords:
  topSeeds:
    - 무선청소기
    - 로봇청소기
    - 공기청정기
    - 가습기
